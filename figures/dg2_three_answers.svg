<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 760 420" role="img" aria-label="How 3,690 NBA regular-season games flow through the study: the replay decides 2,297 and leaves 1,393 open, and the race model gives every game a chance"><title>How 3,690 NBA regular-season games flow through the study: the replay decides 2,297 and leaves 1,393 open, and the race model gives every game a chance</title><defs><marker id="dg-arrow-35de824689" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dg-f-ink3"/></marker></defs><rect x="24" y="108" width="14" height="230" class="dg-f-ink2"/><rect x="560" y="108" width="14" height="230" class="dg-f-accent"/><path d="M38.0,108.0 C169.0,108.0 169.0,92.0 300.0,92.0 L300.0,228.3 C169.0,228.3 169.0,244.3 38.0,244.3 Z" stroke-width="1.5" class="dg-f-nba" opacity="0.3"/><rect x="300" y="92" width="14" height="136.255" class="dg-f-nba"/><path d="M38.0,244.3 C169.0,244.3 169.0,244.3 300.0,244.3 L300.0,251.2 C169.0,251.2 169.0,251.2 38.0,251.2 Z" stroke-width="1.5" class="dg-f-c8" opacity="0.54"/><rect x="300" y="244.255" width="14" height="6.9187" class="dg-f-c8"/><path d="M38.0,251.2 C169.0,251.2 169.0,267.2 300.0,267.2 L300.0,354.0 C169.0,354.0 169.0,338.0 38.0,338.0 Z" stroke-width="1.5" class="dg-f-ink3" opacity="0.27"/><rect x="300" y="267.173" width="14" height="86.8266" class="dg-f-ink3"/><path d="M314.0,92.0 C437.0,92.0 437.0,108.0 560.0,108.0 L560.0,244.3 C437.0,244.3 437.0,228.3 314.0,228.3 Z" stroke-width="1.5" class="dg-f-nba" opacity="0.175"/><path d="M314.0,244.3 C437.0,244.3 437.0,244.3 560.0,244.3 L560.0,251.2 C437.0,251.2 437.0,251.2 314.0,251.2 Z" stroke-width="1.5" class="dg-f-c8" opacity="0.315"/><path d="M314.0,267.2 C437.0,267.2 437.0,251.2 560.0,251.2 L560.0,338.0 C437.0,338.0 437.0,354.0 314.0,354.0 Z" stroke-width="1.5" class="dg-f-ink3" opacity="0.1575"/><text x="24" y="24" font-size="16" class="dg-f-ink dg-text" font-weight="600">3,690 NBA regular-season games, 2023-24 to 2025-26</text><text x="24" y="46" font-size="14" class="dg-f-ink2 dg-text">Trigger: first dead ball under 4:00 of Q4. Target: leading score + 8.</text><text x="24" y="86" font-size="15" class="dg-f-ink dg-text" font-weight="600">All games</text><text x="300" y="86" font-size="15" class="dg-f-ink dg-text" font-weight="600">1  Literal replay</text><text x="560" y="86" font-size="15" class="dg-f-ink dg-text" font-weight="600">2  Race model</text><text x="322" y="165.127" font-size="14" class="dg-f-nba dg-text" font-weight="600">2,186 same winner</text><text x="322" y="252.714" font-size="14" class="dg-f-c8 dg-text" font-weight="600">111 winner changes</text><text x="322" y="315.587" font-size="14" class="dg-f-ink2 dg-text" font-weight="600">1,393 left open</text><text x="322" y="184.127" font-size="14" class="dg-f-ink3 dg-text">decided at the target</text><text x="322" y="334.587" font-size="14" class="dg-f-ink3 dg-text">no team reaches it</text><text x="584" y="126" font-size="14" class="dg-f-ink dg-text" font-weight="600">a chance for</text><text x="584" y="146" font-size="14" class="dg-f-ink dg-text" font-weight="600">all 3,690 games,</text><text x="584" y="166" font-size="14" class="dg-f-ink dg-text" font-weight="600">open or decided</text><text x="584" y="206" font-size="14" class="dg-f-ink3 dg-text">checked first on</text><text x="584" y="226" font-size="14" class="dg-f-ink3 dg-text">9,092 real races</text><text x="584" y="246" font-size="14" class="dg-f-ink3 dg-text">inside games</text><text x="24" y="390" font-size="14" class="dg-f-ink2 dg-text">3  Endgame audit, alongside: overtime, take fouls, free throws, and real minutes</text><text x="24" y="408" font-size="14" class="dg-f-ink2 dg-text">after the trigger, the parts of a real ending the rule would remove.</text></svg>
