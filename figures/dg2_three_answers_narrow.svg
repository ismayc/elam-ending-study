<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 360 520" role="img" aria-label="How 3,690 NBA regular-season games flow through the study: the replay decides 2,297 and leaves 1,393 open, and the race model gives every game a chance"><title>How 3,690 NBA regular-season games flow through the study: the replay decides 2,297 and leaves 1,393 open, and the race model gives every game a chance</title><defs><marker id="dg-arrow-1b941577a8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dg-f-ink3"/></marker></defs><rect x="30" y="96" width="300" height="12" class="dg-f-ink2"/><rect x="30" y="386" width="300" height="12" class="dg-f-accent"/><path d="M30.0,108.0 C30.0,172.0 16.0,172.0 16.0,236.0 L193.7,236.0 C193.7,172.0 207.7,172.0 207.7,108.0 Z" stroke-width="1.5" class="dg-f-nba" opacity="0.3"/><rect x="16" y="236" width="177.724" height="12" class="dg-f-nba"/><path d="M207.7,108.0 C207.7,172.0 207.7,172.0 207.7,236.0 L216.7,236.0 C216.7,172.0 216.7,172.0 216.7,108.0 Z" stroke-width="1.5" class="dg-f-c8" opacity="0.54"/><rect x="207.724" y="236" width="9.02439" height="12" class="dg-f-c8"/><path d="M216.7,108.0 C216.7,172.0 230.7,172.0 230.7,236.0 L344.0,236.0 C344.0,172.0 330.0,172.0 330.0,108.0 Z" stroke-width="1.5" class="dg-f-ink3" opacity="0.27"/><rect x="230.748" y="236" width="113.252" height="12" class="dg-f-ink3"/><path d="M16.0,248.0 C16.0,317.0 30.0,317.0 30.0,386.0 L207.7,386.0 C207.7,317.0 193.7,317.0 193.7,248.0 Z" stroke-width="1.5" class="dg-f-nba" opacity="0.175"/><path d="M207.7,248.0 C207.7,317.0 207.7,317.0 207.7,386.0 L216.7,386.0 C216.7,317.0 216.7,317.0 216.7,248.0 Z" stroke-width="1.5" class="dg-f-c8" opacity="0.315"/><path d="M230.7,248.0 C230.7,317.0 216.7,317.0 216.7,386.0 L330.0,386.0 C330.0,317.0 344.0,317.0 344.0,248.0 Z" stroke-width="1.5" class="dg-f-ink3" opacity="0.1575"/><text x="16" y="30" font-size="13" class="dg-f-ink dg-text" font-weight="600">3,690 NBA regular-season games</text><text x="16" y="48" font-size="12" class="dg-f-ink2 dg-text">trigger under 4:00 of Q4, target lead + 8</text><text x="16" y="76" font-size="13" class="dg-f-ink dg-text" font-weight="600">1  Literal replay splits them:</text><text x="20" y="210" font-size="12" class="dg-f-nba dg-text" font-weight="600">2,186 same winner</text><text x="212.236" y="228" font-size="12" class="dg-f-c8 dg-text" text-anchor="middle" font-weight="600">111 winner changes</text><text x="340" y="210" font-size="12" class="dg-f-ink2 dg-text" text-anchor="end" font-weight="600">1,393 left open</text><text x="16" y="290" font-size="13" class="dg-f-ink dg-text" font-weight="600">2  Race model: a chance for</text><text x="16" y="308" font-size="13" class="dg-f-ink dg-text" font-weight="600">all 3,690 games, open or decided</text><text x="16" y="420" font-size="12" class="dg-f-ink3 dg-text">Checked first on 9,092 real races</text><text x="16" y="438" font-size="12" class="dg-f-ink3 dg-text">inside games.</text><text x="16" y="474" font-size="12" class="dg-f-ink2 dg-text">3  Endgame audit, alongside: overtime,</text><text x="16" y="492" font-size="12" class="dg-f-ink2 dg-text">take fouls, free throws, and real minutes</text><text x="16" y="510" font-size="12" class="dg-f-ink2 dg-text">after the trigger.</text></svg>
